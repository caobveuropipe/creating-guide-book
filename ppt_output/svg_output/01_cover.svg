    </text>
    <rect x="100" y="365" width="120" height="5" rx="2.5" fill="url(#accentGrad)" />
    <text x="100" y="415" fill="#94A3B8" font-size="18" font-family="Segoe UI, sans-serif">
      Kế thừa Master Plan Phase 6 • Drizzle TypeScript Repository • Mô hình phân cấp 6 tầng
    </text>
  </g>

