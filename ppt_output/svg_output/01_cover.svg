    <text x="210" y="185" fill="#38BDF8" font-size="14" font-weight="600" text-anchor="middle" font-family="Segoe UI, sans-serif">HỆ THỐNG NHÂN SỰ VCC</text>
  </g>

  <!-- Header Title Group -->
  <g id="title_group" data-pptx-bounds="100 230 1000 210">
