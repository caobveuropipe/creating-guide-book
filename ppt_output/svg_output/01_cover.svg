    <rect x="100" y="520" width="260" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="124" y="552" fill="#64748B" font-size="13" font-family="Segoe UI, sans-serif">DỰ ÁN NGUỒN</text>
    <text x="124" y="580" fill="#F8FAFC" font-size="16" font-weight="600" font-family="Segoe UI, sans-serif">Module_NhanSu_moi</text>

    <rect x="390" y="520" width="260" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="414" y="552" fill="#64748B" font-size="13" font-family="Segoe UI, sans-serif">CÔNG NGHỆ CHÍNH</text>
    <text x="414" y="580" fill="#F8FAFC" font-size="16" font-weight="600" font-family="Segoe UI, sans-serif">Hono • Drizzle • PostgreSQL</text>

    <rect x="680" y="520" width="260" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
