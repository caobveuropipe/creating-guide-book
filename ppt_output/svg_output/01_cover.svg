<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect id="bg_rect" width="1280" height="720" fill="url(#bgGrad)" data-pptx-role="background" />
  <circle id="bg_circle1" cx="1150" cy="150" r="320" fill="#1E3A8A" opacity="0.15" data-pptx-role="decoration" />
  <circle id="bg_circle2" cx="150" cy="650" r="220" fill="#0284C7" opacity="0.1" data-pptx-role="decoration" />

  <!-- Badge / Pill -->
  <g id="badge" data-pptx-bounds="100 160 220 38">
