<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background Frame -->
  <rect id="bg_rect_slide5" width="1280" height="720" fill="url(#bgGrad5)" data-pptx-role="background" />

  <!-- Header -->
  <g id="header_ui" data-pptx-bounds="80 40 1120 75">
    <text x="80" y="65" fill="#38BDF8" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif" letter-spacing="1">HƯỚNG DẪN THAO TÁC TRỰC QUAN (ANNOTATED UI GUIDE)</text>
    <text x="80" y="102" fill="#FFFFFF" font-size="26" font-weight="700" font-family="Segoe UI, sans-serif">Xác Thực Cổng SSO &amp; Các Điểm Thao Tác Cây Đơn Vị</text>
  </g>

  <!-- Left Card: Login Page Annotated Screenshot -->
  <g id="ui_login_card" data-pptx-bounds="80 135 480 535">
    <rect x="80" y="135" width="480" height="535" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="168" fill="#38BDF8" font-size="15" font-weight="700" font-family="Segoe UI, sans-serif">Bước 1: Đăng Nhập &amp; Xác Thực Quyền</text>
    <text x="105" y="190" fill="#94A3B8" font-size="12" font-family="Segoe UI, sans-serif">Tự động điều hướng về SSO khi chưa có phiên đăng nhập.</text>

    <!-- Annotated Image Frame -->
    <rect x="95" y="210" width="450" height="295" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <image href="../images/01_login_annotated.png" x="98" y="213" width="444" height="289" preserveAspectRatio="xMidYMid meet" />

    <!-- Step legends -->
    <text x="105" y="535" fill="#EF4444" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">① Nút Đăng nhập Google:</text>
    <text x="260" y="535" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Cấp token phiên &amp; actorContext.</text>
    <text x="105" y="560" fill="#3B82F6" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">② Vùng ProtectedRoute:</text>
    <text x="260" y="560" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Chặn toàn bộ URL /admin/* trái phép.</text>
  </g>

  <!-- Right Card: Org Units Page Annotated Screenshot -->
  <g id="ui_tree_card" data-pptx-bounds="580 135 620 535">
    <rect x="580" y="135" width="620" height="535" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="605" y="168" fill="#38BDF8" font-size="15" font-weight="700" font-family="Segoe UI, sans-serif">Bước 2: Quản Trị Cây Đơn Vị Phân Cấp</text>
    <text x="605" y="190" fill="#94A3B8" font-size="12" font-family="Segoe UI, sans-serif">Giao diện điều hướng cây 6 cấp không lặp node (/admin/org-units).</text>

    <!-- Annotated Image Frame -->
    <rect x="595" y="210" width="590" height="295" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
    <image href="../images/02_org_units_annotated.png" x="598" y="213" width="584" height="289" preserveAspectRatio="xMidYMid meet" />

    <!-- Step legends -->
    <text x="605" y="530" fill="#3B82F6" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">① Cột Khối:</text>
    <text x="685" y="530" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Cấp 1 cao nhất quản lý quyền hạn dữ liệu EA/SA.</text>

    <text x="605" y="555" fill="#EF4444" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">② Nút (+):</text>
    <text x="685" y="555" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Mở modal thêm nhanh đơn vị trực thuộc nhánh cha.</text>

    <text x="605" y="580" fill="#22C55E" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">③ Chọn Node:</text>
    <text x="685" y="580" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Click để mở rộng các phòng ban con cấp dưới.</text>

    <text x="605" y="605" fill="#F59E0B" font-size="12" font-weight="700" font-family="Segoe UI, sans-serif">④ Bộ Lọc:</text>
    <text x="685" y="605" fill="#E2E8F0" font-size="12" font-family="Segoe UI, sans-serif">Tìm kiếm nhanh theo tên hoặc lọc theo từng khối cụ thể.</text>
  </g>
</svg>
