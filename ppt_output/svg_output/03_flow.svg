<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect id="bg_rect_slide3" width="1280" height="720" fill="url(#bgGrad3)" data-pptx-role="background" />

  <!-- Header -->
  <g id="header_flow" data-pptx-bounds="80 50 1120 70">
    <text x="80" y="70" fill="#38BDF8" font-size="14" font-weight="700" font-family="Segoe UI, sans-serif" letter-spacing="1">KIẾN TRÚC GIAO DỊCH ATOMIC</text>
    <text x="80" y="110" fill="#FFFFFF" font-size="28" font-weight="700" font-family="Segoe UI, sans-serif">Luồng Dữ Liệu &amp; Drizzle TypeScript Repository</text>
  </g>

  <!-- Step 1 Card -->
  <g id="step1" data-pptx-bounds="80 150 260 420">
    <rect x="80" y="150" width="260" height="420" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="80" y="150" width="260" height="45" rx="10" fill="#1E3A8A" />
    <text x="210" y="178" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, sans-serif">1. Frontend UI React</text>
    <text x="100" y="230" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Cổng Quản Trị:</text>
    <text x="100" y="255" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• /admin/org-units</text>
    <text x="100" y="280" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Google SSO Auth Guard</text>
    <text x="100" y="305" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Bảo vệ bằng &lt;ProtectedRoute&gt;</text>

    <text x="100" y="350" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Tương Tác User:</text>
    <text x="100" y="375" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Xem cây không lặp node</text>
    <text x="100" y="400" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Form tạo đơn vị modal</text>
    <text x="100" y="425" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Chức năng ngưng hoạt động</text>
  </g>

  <!-- Step 2 Card -->
  <g id="step2" data-pptx-bounds="370 150 260 420">
    <rect x="370" y="150" width="260" height="420" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="370" y="150" width="260" height="45" rx="10" fill="#0284C7" />
    <text x="500" y="178" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, sans-serif">2. API Hono Route</text>
    <text x="390" y="230" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Các Endpoint Chuẩn:</text>
    <text x="390" y="255" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• GET /api/org-units/tree</text>
    <text x="390" y="280" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• GET /api/org-units/catalog</text>
    <text x="390" y="305" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• POST /api/org-units</text>
    <text x="390" y="330" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• PATCH /api/org-units/:id</text>
    <text x="390" y="355" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• POST .../deactivate</text>

    <text x="390" y="400" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Xác Thực Ngữ Cảnh:</text>
    <text x="390" y="425" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Trích xuất actorContext</text>
    <text x="390" y="450" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Validate schema qua Zod</text>
  </g>

  <!-- Step 3 Card -->
  <g id="step3" data-pptx-bounds="660 150 260 420">
    <rect x="660" y="150" width="260" height="420" rx="10" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
    <rect x="660" y="150" width="260" height="45" rx="10" fill="#2563EB" />
    <text x="790" y="178" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, sans-serif">3. Drizzle Repository</text>
    <text x="680" y="230" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Xóa Bỏ Stored Procedures:</text>
    <text x="680" y="255" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Thay thế hoàn toàn RPC cũ</text>
    <text x="680" y="280" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Chạy trong atomic tx: DbOrTx</text>

    <text x="680" y="325" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Kiểm Tra Ràng Buộc:</text>
    <text x="680" y="350" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Kiểm tra quyền theo Khối</text>
    <text x="680" y="375" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Chặn vòng lặp cha-con</text>
    <text x="680" y="400" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Cascade Guard chặn xóa</text>
    <text x="680" y="425" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">  nếu còn nhân sự active</text>
  </g>

  <!-- Step 4 Card -->
  <g id="step4" data-pptx-bounds="950 150 250 420">
    <rect x="950" y="150" width="250" height="420" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="950" y="150" width="250" height="45" rx="10" fill="#0D9488" />
    <text x="1075" y="178" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, sans-serif">4. PostgreSQL DB</text>
    <text x="970" y="230" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">Bảng Dữ Liệu:</text>
    <text x="970" y="255" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• org_units (UUID, parent_id)</text>
    <text x="970" y="280" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• employee_org_assignments</text>

    <text x="970" y="330" fill="#38BDF8" font-size="14" font-weight="600" font-family="Segoe UI, sans-serif">DB Triggers Tự Động:</text>
    <text x="970" y="355" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Chuẩn hóa tên đơn vị</text>
    <text x="970" y="380" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Tự sinh slug &amp; path</text>
    <text x="970" y="405" fill="#94A3B8" font-size="13" font-family="Segoe UI, sans-serif">• Cập nhật tree_version</text>
  </g>

  <!-- Bottom Note Group -->
  <g id="footer_flow_note" data-pptx-bounds="80 600 1120 40">
    <text x="640" y="625" fill="#64748B" font-size="14" text-anchor="middle" font-family="Segoe UI, sans-serif">
      Sự chuyển dịch kiến trúc sang Drizzle TypeScript giúp tăng tốc độ truy vấn cây &amp; đảm bảo toàn vẹn dữ liệu 100%.
    </text>
  </g>
</svg>
